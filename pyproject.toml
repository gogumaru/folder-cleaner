[project]
name = "folder-cleaner"
version = "0.1.0"
description = "Prototype agen perapi file berbasis isi, sepenuhnya lokal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "rich>=13.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Model Apple on-device (M5). Hanya macOS 26+, dibangun dari source: butuh Xcode 26+.
apple = ["apple-fm-sdk>=0.2; sys_platform == 'darwin'"]

[project.scripts]
sorter = "sorter.cli:app"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sorter"]